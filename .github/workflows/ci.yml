name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: pip-audit -r requirements.txt
    env:
      DJANGO_DEBUG: "1"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --detach --wait
      - name: イメージにインストールされたパッケージの脆弱性を確認
        run: docker compose run --rm -T api pip-audit
      - run: sh scripts/smoke.sh
      - name: SIGTERM で正常終了すること
        run: |
          docker compose stop
          test "$(docker compose ps --all --format '{{.ExitCode}}')" = "0"
      - if: failure()
        run: docker compose logs api
      - if: always()
        run: docker compose down --volumes
