services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - lucky-draw-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

volumes:
  lucky-draw-data:
