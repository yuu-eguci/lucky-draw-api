services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - lucky-draw-data:/data
    healthcheck:
      # DJANGO_ALLOWED_HOSTS に 127.0.0.1 がなくても判定できるよう、5xx 以外の応答を正常とみなします
      test: ["CMD", "python", "-c", "import http.client as h; c = h.HTTPConnection('127.0.0.1', 8080, timeout=4); c.request('GET', '/api/v1/'); raise SystemExit(c.getresponse().status >= 500)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

volumes:
  lucky-draw-data:
